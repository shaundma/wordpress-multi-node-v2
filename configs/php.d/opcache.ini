; Loads the OPcache zend extension here so this file is self-contained:
; a Jelastic PHP package redeploy wipes the zend_extension line out of
; /etc/php.ini, and without this line in /etc/php.d restorePhpConfig would
; land tuning values for an extension PHP never ends up loading.
zend_extension=opcache.so

[opcache]
opcache.enable=1
opcache.memory_consumption=512
opcache.interned_strings_buffer=64
opcache.max_accelerated_files=32500
opcache.validate_timestamps=1
opcache.save_comments=1
opcache.revalidate_freq=60
opcache.fast_shutdown=1
opcache.enable_cli=1
