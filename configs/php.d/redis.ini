; Loads the Redis object-cache extensions. On a Jelastic PHP package
; redeploy /etc/php.ini is reset to vanilla (dropping the installer's
; sed-enabled extension lines), so these two must live in /etc/php.d
; so the restorePhpConfig redeploy hook can re-lay them without touching
; /etc/php.ini. igbinary first - the Redis object cache serialises
; through it.
extension=igbinary.so
extension=redis.so
